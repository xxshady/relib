[package]
name = "relib_interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "relib is a framework for reloadable dynamic libraries"

[features]
default = ["public"]

build = [
  "dep:relib_shared",
  "dep:prettyplease",
  "dep:proc-macro2",
  "dep:quote",
  "dep:syn",
]
include = []
internal = []
public = []
unloading = []

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]

[dependencies.relib_shared]
relib_shared = { version = "=0.7.0", path = "../relib_shared" }

[dependencies.prettyplease]
optional = true
version = "0.2.25"
features = ["verbatim"]

[dependencies.proc-macro2]
optional = true
workspace = true

[dependencies.quote]
optional = true
workspace = true

[dependencies.syn]
optional = true
workspace = true
